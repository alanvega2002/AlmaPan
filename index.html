<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Configuración básica del documento -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALMAPAN Panadería y Pastelería</title>
  <style>
    /* Estilos globales para el cuerpo del documento */
    body {
        background-image: url("assets/img/logoOscuro.png"); /* Fondo con imagen de logo */
        font-family: Arial, sans-serif; /* Fuente predeterminada */
        margin: 0; /* Eliminar márgenes */
        padding: 0; /* Eliminar relleno */
    }
    
    /* Estilos para la barra de navegación */
    .navbar {
        background-color: #393939; /* Fondo gris oscuro */
        display: flex; /* Usar flexbox para alinear elementos */
        justify-content: space-between; /* Espacio entre elementos */
        align-items: center; /* Centrar verticalmente */
        padding: 10px 20px; /* Relleno interno */
        border-bottom: 4px solid red; /* Borde inferior rojo */
    }

    /* Estilos para el logo en la barra de navegación */
    .navbar-logo h1 {
        color: red; /* Color del texto */
        font-size: 24px; /* Tamaño de la fuente */
    }

    /* Estilos para la imagen del logo */
    .navbar-logo img {
        width: 100px; /* Ancho de la imagen */
        height: auto; /* Mantener la proporción de la imagen */
    }

    /* Estilos para la lista de enlaces en la barra de navegación */
    .navbar-links {
        list-style: none; /* Eliminar viñetas de la lista */
        display: flex; /* Usar flexbox para alinear elementos */
        margin: 0; /* Eliminar márgenes */
        padding: 0; /* Eliminar relleno */
    }

    /* Estilos para cada elemento de la lista de enlaces */
    .navbar-links li {
        margin-left: 20px; /* Margen izquierdo entre elementos */
    }

    /* Estilos para los enlaces en la barra de navegación */
    .navbar-links a {
        text-decoration: none; /* Eliminar subrayado */
        color: red; /* Color del texto */
        font-weight: bold; /* Texto en negrita */
    }

    /* Efecto hover para los enlaces */
    .navbar-links a:hover {
        color: white; /* Cambiar color del texto */
        background-color: red; /* Cambiar color de fondo */
        padding: 5px; /* Añadir relleno */
    }

    /* Contenedor de sucursales */
    .sucursales-container {
        display: flex;
        flex-direction: column; /* Cambiar a columna */
        align-items: center; /* Centrar horizontalmente */
        gap: 20px; /* Espacio entre elementos */
        padding: 20px; /* Relleno interno */
    }

    /* Estilos para cada sucursal */
    .sucursal {
        text-align: center; /* Centrar texto */
        background-color: white; /* Fondo blanco */
        border: 1px solid #ccc; /* Borde gris */
        border-radius: 10px; /* Bordes redondeados */
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Sombra para resaltar */
        padding: 20px; /* Relleno interno */
        max-width: 600px; /* Ancho máximo */
        width: 100%; /* Ocupar todo el ancho disponible */
    }

    /* Estilos para los mapas interactivos */
    .sucursal iframe {
        width: 100%; /* Ancho completo */
        height: 200px; /* Altura fija */
        border: none; /* Eliminar borde */
        border-radius: 10px; /* Bordes redondeados */
        margin-bottom: 15px; /* Margen inferior */
    }

    /* Estilos para la imagen de la Sucursal 3 */
    .sucursal img {
        width: 100%; /* Ancho completo */
        height: auto; /* Mantener la proporción de la imagen */
        border-radius: 10px; /* Bordes redondeados */
        margin-bottom: 15px; /* Margen inferior */
    }

    /* Estilos para el botón de Google Maps */
    .btn-maps {
        background-color: red; /* Fondo rojo */
        color: white; /* Color del texto */
        padding: 10px 20px; /* Relleno interno */
        border: none; /* Eliminar borde */
        cursor: pointer; /* Cambiar cursor al pasar el ratón */
        font-size: 16px; /* Tamaño de la fuente */
        margin-top: 10px; /* Margen superior */
        border-radius: 5px; /* Bordes redondeados */
    }

    /* Efecto hover para el botón de Google Maps */
    .btn-maps:hover {
        background-color: darkred; /* Cambiar color de fondo */
    }

    /* Estilos para el footer */
    footer {
        padding: 10px; /* Relleno interno */
        text-align: center; /* Centrar texto */
    }

    /* Estilos para el texto del footer */
    footer p {
        color: white; /* Color del texto */
        margin: 0; /* Eliminar margen predeterminado */
    }
  </style>
</head>
<body>

  <!-- Menú de navegación -->
  <nav class="navbar">
    <div class="navbar-logo">
      <h1>ALMAPAN Panadería y Pastelería</h1>
    </div>
    <ul class="navbar-links">
      <li><a href="index.html">Inicio</a></li>
      <li><a href="contacto.html">Contacto</a></li>
    </ul>
  </nav>

  <!-- Contenedor de Sucursales -->
  <section class="sucursales-container">
    <!-- Sucursal 1 -->
    <div class="sucursal">
      <h2>Sucursal Los Notros</h2>
      <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d12345.678901234567!2d-72.9805506!3d-41.4803518!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x6b286e1274aed0d7!2sALMA%20PAN%20Panader%C3%ADa%20Y%20Pasteler%C3%ADa!5e0!3m2!1ses!2scl!4v1234567890123!5m2!1ses!2scl"
        allowfullscreen
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
      ></iframe>
      <a href="https://www.google.cl/maps/place/ALMA+PAN+Panader%C3%ADa+Y+Pasteler%C3%ADa/@-41.4803518,-72.9805506,18z/data=!3m1!4b1!4m6!3m5!1s0x96183b0073fc7c69:0x6b286e1274aed0d7!8m2!3d-41.4803518!4d-72.9792778!16s%2Fg%2F11wbw8lxhc?entry=ttu&g_ep=EgoyMDI1MDEyOS4xIKXMDSoASAFQAw%3D%3D" target="_blank">
        <button class="btn-maps">Ver en Google Maps</button>
      </a>
    </div>

    <!-- Sucursal 2 -->
    <div class="sucursal">
      <h2>Sucursal Magallanes</h2>
      <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d12345.678901234567!2d-72.9495446!3d-41.4579039!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x96183b0305b21351%3A0x3b6e409f45fa18ec!2sJose%20Miguel%20Carrera%20437%2C%205500530%20Puerto%20Montt%2C%20Los%20Lagos!5e0!3m2!1ses!2scl!4v1234567890123!5m2!1ses!2scl"
        allowfullscreen
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
      ></iframe>
      <a href="https://www.google.cl/maps/place/Jose+Miguel+Carrera+437,+5500530+Puerto+Montt,+Los+Lagos/@-41.4579039,-72.9495446,21z/data=!4m6!3m5!1s0x96183b0305b21351:0x3b6e409f45fa18ec!8m2!3d-41.4580122!4d-72.9495861!16s%2Fg%2F11wb2rcgjn?entry=ttu&g_ep=EgoyMDI1MDEyOS4xIKXMDSoASAFQAw%3D%3D" target="_blank">
        <button class="btn-maps">Ver en Google Maps</button>
      </a>
    </div>

    <!-- Sucursal 3 -->
    <div class="sucursal">
      <img src="assets/img/Proximamente.png" alt="Sucursal 3">
      <h2>Próximamente</h2>
      <a href="https://www.google.com/maps/place/ALMAPAN+Sur/" target="_blank">
        <button class="btn-maps">Ver en Google Maps</button>
      </a>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>© 2025 ALMAPAN. Todos los derechos reservados.</p>
  </footer>

</body>
</html>
